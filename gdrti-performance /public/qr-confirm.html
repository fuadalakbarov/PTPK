<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Girişi təsdiqlə — GDRTI Performans</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-hero-text">
    <h1>📱 Girişi təsdiqlə</h1>
    <p>Kompüterinizdə açdığınız GDRTI Performans sisteminə daxil olmaq üçün öz hesabınızla təsdiqləyin.</p>
  </div>
  <div class="login-card" id="cardBox">
    <h1>Təsdiqlə</h1>
    <p class="sub">Aşağıdakı üsullardan biri ilə öz hesabınızı təsdiqləyin</p>

    <button type="button" class="btn google-btn" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 18 18" style="margin-right:8px;"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.36 0-4.35-1.59-5.06-3.73H.9v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.94 10.69A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.16.28-1.69V4.98H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.02l3.04-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.98l3.04 2.33C4.65 5.17 6.64 3.58 9 3.58z"/></svg>
      Google ilə təsdiqlə
    </button>
    <div class="error-msg" id="googleErr"></div>

    <div class="divider"><span>və ya admin girişi</span></div>

    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required placeholder="admin@gdrti.az">
      </div>
      <div class="field">
        <label>Şifrə</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn">Təsdiqlə</button>
      <div class="error-msg" id="errMsg"></div>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/api.js"></script>
<script>
const params = new URLSearchParams(location.search);
const sessionId = params.get('session');

function showSuccess(){
  document.getElementById('cardBox').innerHTML = `
    <div style="text-align:center; padding:20px 0;">
      <div style="font-size:2.6rem; margin-bottom:10px;">✅</div>
      <h1 style="margin-bottom:8px;">Təsdiqləndi!</h1>
      <p class="sub">Kompüterinizə qayıdın, avtomatik daxil olunacaq.</p>
    </div>`;
}

async function confirmSession(appToken){
  if (!sessionId) { alert('Sessiya tapılmadı, QR kodu yenidən skan edin.'); return; }
  await apiCall('/auth/qr/confirm', 'POST', { session_id: sessionId, token: appToken });
  showSuccess();
}

// Admin (email/şifrə) forması
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('errMsg');
  errEl.textContent = '';
  try {
    const data = await apiCall('/auth/login', 'POST', { email, password });
    await confirmSession(data.token);
  } catch (err) {
    errEl.textContent = err.message;
  }
});

// Google düyməsi
document.getElementById('googleBtn').addEventListener('click', async () => {
  await supabaseClient.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: location.origin + '/qr-confirm.html?session=' + sessionId }
  });
});

// Google-dan geri qayıdanda
(async function checkGoogleSession(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) return;
  const errEl = document.getElementById('googleErr');
  try {
    const data = await apiCall('/auth/google', 'POST', { access_token: session.access_token });
    await supabaseClient.auth.signOut();
    if (data.user.pending) {
      alert('Hesabınız yeni yaradıldı — admin sizi sektora təyin edənə qədər gözləyin. Yenə də girişi təsdiqləyə bilərsiniz.');
    }
    await confirmSession(data.token);
  } catch (err) {
    errEl.textContent = err.message;
  }
})();
</script>
</body>
</html>
