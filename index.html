    <script>
(async function authGuard() {
    const token = localStorage.getItem('ptpk_token');
    if (!token) { window.location.href = '/login.html'; return; }
    try {
        const res = await fetch('/api/auth/check-session', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({token})
        });
        const data = await res.json();
        if (data.status !== 'valid') {
            localStorage.removeItem('ptpk_token');
            localStorage.removeItem('ptpk_role');
            localStorage.removeItem('ptpk_email');
            window.location.href = '/login.html';
        }
    } catch { window.location.href = '/login.html'; }
})();

async function logout() {
    const token = localStorage.getItem('ptpk_token');
    try {
        await fetch('/api/auth/logout', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({token})
        });
    } catch {}
    localStorage.removeItem('ptpk_token');
    localStorage.removeItem('ptpk_role');
    localStorage.removeItem('ptpk_email');
    window.location.href = '/login.html';
}

window.addEventListener('DOMContentLoaded', () => {
    const email = localStorage.getItem('ptpk_email') || '';
    const el = document.getElementById('user-name-display');
    if (el && email) el.textContent = email;
});
</script>

<script>
// PWA Service Worker
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });
}
async function submitForm() {
    const form = document.getElementById('studentForm');
    
    // Formadakı boşluqları yoxlayırıq
    const fin = document.getElementById('finCode').value.trim();
    const name = document.getElementById('studentName').value.trim();
    const schoolSelect = document.getElementById('schoolSelect');
    
    if(!fin || !name || schoolSelect.value === "") {
        alert("Zəhmət olmasa tələb olunan xanaları tam doldurun!");
        return;
    }

    // 6 sənədin yüklənib-yüklənmədiyini yoxlayırıq
    const reqFiles = ['coverLetter', 'residenceCertificate', 'xasiyyetname', 'idCopies', 'tabel', 'forma027'];
    for(let id of reqFiles) {
        if(document.getElementById(id).files.length === 0) {
            alert("Zəhmət olmasa tələb olunan 6 sənədin hər birini tam yükləyin!");
            return;
        }
    }

    // Bütün form məlumatlarını və faylları paketləyirik
    const formData = new FormData(form);

    try {
        // Məlumatları Mac-inizdə işləyən Python serverinə (port 8001) göndəririk
        const response = await fetch('/api/school/submit-student', {
            method: 'POST',
            body: formData
        });

        if (response.ok) {
            alert("Uğurlu əməliyyat! Sənədlər rəsmi verilənlər bazasına (SQLite) yazıldı və fayllar yadda saxlanıldı.");
            form.reset();
        } else {
            alert("Server xətası baş verdi. Məlumat yazılmadı.");
        }
    } catch (error) {
        console.error("Bağlantı xətası:", error);
        alert("Python serverinə bağlanmaq mümkün olmadı! Terminalda 'main.py'-ın işlədiyindən əmin olun.");
    }
}
</script>
</body>
</html>
