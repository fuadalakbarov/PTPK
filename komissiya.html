<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTPK | Komissiya Paneli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --gradient-start: #0284c7;  
            --gradient-end: #0f172a;    
            --primary-navy: #0f172a;     
            --brand-blue: #0284c7;       
            --text-dark: #0f172a;        
            --text-muted: #475569;       
            --border-strong: #0284c7;    
            --border-window: #0f172a;    
            --success-green: #16a34a;
            --danger-red: #dc2626;
            --warning-orange: #d97706;
            --excel-bg: #f8fafc;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        body { 
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            background-attachment: fixed; height: 100vh; width: 100vw; overflow: hidden; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
        }
        .app-window { display: flex; width: 100%; max-width: 1650px; height: 85vh; background: #ffffff; border-radius: 16px; border: 2px solid var(--border-window); box-shadow: 0 20px 40px rgba(15, 23, 42, 0.3); overflow: hidden; }
        
        /* 🔒 İzolyasiya olunmuş sol menyu */
        .nav-sidebar { width: 80px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 25px 0; background: #ffffff; border-right: 2px solid var(--border-window); flex-shrink: 0; }
        .nav-item { width: 48px; height: 48px; border-radius: 12px; display: flex; justify-content: center; align-items: center; color: #ffffff; font-size: 18px; background: var(--brand-blue); border: 2px solid var(--brand-blue); cursor: default; }
        
        .viewport { flex: 1; padding: 25px 30px; display: flex; flex-direction: column; background: #ffffff; height: 100%; overflow: hidden; }
        .brand-header { display: flex; align-items: center; gap: 20px; padding-bottom: 15px; border-bottom: 2px solid #e2e8f0; flex-shrink: 0; }
        .brand-logo { height: 45px; width: auto; }
        .brand-text h1 { font-size: 20px; font-weight: 700; color: var(--primary-navy); }

        .manual-entry-bar {
            display: flex; flex-wrap: wrap; gap: 8px; background: #f1f5f9; padding: 12px 15px; margin-top: 15px; border-radius: 8px; border: 2px solid var(--primary-navy); align-items: center; flex-shrink: 0;
        }
        .manual-entry-bar input, .manual-entry-bar select { padding: 6px 10px; font-size: 12px; font-weight: 600; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
        .btn-add-manual { background: var(--primary-navy); color: white; padding: 8px 14px; border: none; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .btn-add-manual:hover { background: var(--brand-blue); }

        .search-container { margin-top: 10px; position: relative; width: 100%; max-width: 450px; flex-shrink: 0; }
        .search-input { width: 100%; padding: 8px 15px 8px 40px; font-size: 13px; font-weight: 600; border: 2px solid var(--primary-navy); border-radius: 8px; outline: none; }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--primary-navy); }

        .panel-layout { display: grid; grid-template-columns: 2.5fr 1.1fr; gap: 20px; margin-top: 15px; flex: 1; overflow: hidden; }
        .panel-column { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
        .section-title { font-size: 13px; font-weight: 700; color: var(--primary-navy); margin-bottom: 10px; text-transform: uppercase; }

        .excel-container { flex: 1; overflow: auto; border: 2px solid var(--border-window); border-radius: 8px; }
        .excel-table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
        .excel-table th { background: var(--primary-navy); color: white; font-weight: 700; padding: 12px 10px; position: sticky; top: 0; z-index: 10; }
        
        .excel-table th:nth-child(1), .excel-table td:nth-child(1) { width: 25%; }
        .excel-table th:nth-child(2), .excel-table td:nth-child(2) { width: 10%; }
        .excel-table th:nth-child(3), .excel-table td:nth-child(3) { width: 9%; }
        .excel-table th:nth-child(4), .excel-table td:nth-child(4) { width: 12%; }
        .excel-table th:nth-child(5), .excel-table td:nth-child(5) { width: 11%; }
        .excel-table th:nth-child(6), .excel-table td:nth-child(6) { width: 21%; }
        .excel-table th:nth-child(7), .excel-table td:nth-child(7) { width: 6%; }
        .excel-table th:nth-child(8), .excel-table td:nth-child(8) { width: 6%; }

        .school-row { background: #e2e8f0 !important; font-weight: 700; color: var(--primary-navy); }
        .school-row td { padding: 10px; border-bottom: 2px solid #cbd5e1; }
        .student-row { cursor: pointer; background: #ffffff; height: 44px; }
        .student-row:nth-child(even) { background: #f8fafc; }
        .student-row:hover, .student-row.active { background: #f0fdf4 !important; }
        .student-row td { padding: 8px 10px; border: 1px solid #e2e8f0; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }

        .status-pill { font-size: 11px; font-weight: 700; padding: 4px 0; width: 100%; text-align: center; border-radius: 4px; display: block; }
        .status-pill.tam { background: #dcfce7; color: var(--success-green); }
        .status-pill.gozleme { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
        .status-pill.quvvede { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
        .status-pill.dusub { background: #fee2e2; color: var(--danger-red); border: 1px solid #fca5a5; }

        .preview-container { border: 2px solid var(--border-strong); border-radius: 8px; background: #ffffff; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
        .right-card-body { flex: 1; overflow-y: auto; padding: 15px; }
        .decision-box { margin-top: 12px; padding-top: 12px; border-top: 2px dashed #e2e8f0; }
        .decision-box label { display: block; font-size: 12px; font-weight: 700; color: var(--primary-navy); margin-top: 10px; margin-bottom: 4px; }
        .decision-box select, .decision-box textarea, .decision-box input { width: 100%; border: 2px solid var(--border-strong); border-radius: 6px; padding: 8px; font-size: 13px; margin-bottom: 4px; font-weight: 600; outline: none; }
        .decision-box textarea { height: 60px; resize: none; }
        
        .file-upload-wrapper { border: 2px dashed #cbd5e1; border-radius: 6px; padding: 10px; text-align: center; background: #f8fafc; cursor: pointer; margin-bottom: 12px; position: relative; }
        .file-upload-wrapper:hover { border-color: var(--brand-blue); background: #f0f9ff; }
        .file-upload-wrapper i { font-size: 18px; color: var(--brand-blue); margin-bottom: 4px; }
        .file-upload-wrapper p { font-size: 11px; font-weight: 600; color: var(--text-muted); }
        .file-upload-wrapper input[type="file"] { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .uploaded-file-info { font-size: 11px; color: var(--success-green); font-weight: 700; margin-top: 4px; display: none; }

        .btn-approve { width: 100%; background: var(--success-green); color: white; height: 40px; border: none; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; }
        .btn-approve:hover { background: #15803d; }
        .btn-download-cell { border: none; background: none; cursor: pointer; color: var(--brand-blue); font-size: 14px; }
        .btn-download-cell:hover { color: var(--primary-navy); }
    </style>

                                <option value="Xüsusi təhsil (Xüsusi proqram)">Xüsusi təhsil (Xüsusi proqram)</option>
                                <option value="Sağlamdır (Ümumi təhsil)">Sağlamdır (Ümumi təhsil)</option>
                            </select>

                            <label>Qüvvədən Düşmə Tarixi:</label>
                            <input type="date" id="decision-expiry-date">

                            <label>Komissiya Diaqnozu / Rəyi:</label>
                            <textarea id="text-notes" placeholder="Rəsmi protokolu daxil edin..."></textarea>
                            
                            <label>Rəsmi Sənədi Əllə Yüklə (Skan/PDF):</label>
                            <div class="file-upload-wrapper">
                                <i class="fa-solid fa-cloud-arrow-up"></i>
                                <p id="upload-status-text">Faylı bura sürükləyin və ya klikləyin</p>
                                <input type="file" id="manual-file-upload" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" onchange="handleManualFile(this)">
                                <div id="file-info-label" class="uploaded-file-info"></div>
                            </div>

                            <button type="button" class="btn-approve" onclick="saveCommissionDecision()">
                                Qərarı Saxla <i class="fa-solid fa-floppy-disk"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let selectedAppId = null;
let uploadedFileBase64 = null;
let uploadedFileName = null;

document.addEventListener("DOMContentLoaded", loadCommissionTable);

function getStatusPillClass(status) {
    if (status === "Qüvvədədir") return "quvvede";
    if (status === "Qüvvədən düşüb") return "dusub";
    return "gozleme";
}

async function loadCommissionTable() {
    const tableBody = document.getElementById('table-data-body');
    if(!tableBody) return;
    tableBody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:20px;color:#94a3b8;"><i class="fa-solid fa-spinner fa-spin"></i> Yüklənir...</td></tr>';

    let data = [];
    try {
        const res = await fetch('http://127.0.0.1:8001/api/komissiya/get-applications');
        data = await res.json();
    } catch(e) {
        tableBody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:20px;color:red;">&#9888;&#65039; Serverə qoşulmaq mümkün olmadı. Python serveri işlədiyindən əmin olun.</td></tr>';
        return;
    }

    if(data.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:20px; color:var(--text-muted);">Cədvəldə məlumat yoxdur. Sənəd göndərin və ya əllə yazın.</td></tr>`;
        return;
    }

    let grouped = {};
    data.forEach(app => {
        if(!grouped[app.schoolText]) grouped[app.schoolText] = [];
        grouped[app.schoolText].push(app);
    });

    for (let school in grouped) {
        let schoolRow = document.createElement('tr');
        schoolRow.className = "school-row";
        schoolRow.innerHTML = `<td colspan="8"><i class="fa-solid fa-building"></i> ${school}</td>`;
        tableBody.appendChild(schoolRow);

        grouped[school].forEach(app => {
            let tr = document.createElement('tr');
            tr.className = "student-row";
            if(selectedAppId === app.id) tr.classList.add('active');
            tr.onclick = function() { selectStudent(app, tr); };

            let statusClass = getStatusPillClass(app.decisionStatus);

            tr.innerHTML = `
                <td><strong>${app.name} (${app.fin})</strong></td>
                <td>${app.year}</td>
                <td><span class="status-pill tam">${app.docStatus}</span></td>
                <td><span class="status-pill ${statusClass}">${app.decisionStatus || 'Gözləmədə'}</span></td>
                <td>${app.expiryDate || '-'}</td>
                <td>${app.educationForm}</td>
                <td style="text-align:center;">
                    <button class="btn-download-cell" onclick="event.stopPropagation(); downloadDecisionPDF('${app.id}')" title="Sənədi Endir">
                        <i class="fa-solid ${app.hasManualFile ? 'fa-file-lines' : 'fa-file-pdf'}" style="${app.hasManualFile ? 'color:var(--success-green);' : ''}"></i>
                    </button>
                </td>
                <td style="text-align:center;">
                    <button style="border:none; background:none; cursor:pointer;" onclick="event.stopPropagation(); deleteStudent('${app.id}')">
                        <i class="fa-solid fa-trash-can" style="color:var(--danger-red);"></i>
                    </button>
                </td>
            `;
            tableBody.appendChild(tr);
        });
    }
}

async function addStudentManually() {
    const name = document.getElementById('manual-name').value.trim();
    const fin = document.getElementById('manual-fin').value.trim().toUpperCase();
    const schoolSelect = document.getElementById('manual-school');
    const schoolValue = schoolSelect.value;
    const schoolText = schoolSelect.options[schoolSelect.selectedIndex].text;
    
    const year = document.getElementById('manual-year').value;
    const docStatus = document.getElementById('manual-doc').value;
    const decisionStatus = document.getElementById('manual-status').value;
    const expiryInput = document.getElementById('manual-expiry').value;
    const educationForm = document.getElementById('manual-form').value;

    if(!name || !fin) {
        alert("Zəhmət olmasa şagirdin adını və FİN kodunu yazın!");
        return;
    }

    const expiryDate = expiryInput ? expiryInput.split('-').reverse().join('.') : "-";

    const emptyBlob = new Blob([''], {type: 'application/octet-stream'});
    const formData = new FormData();
    formData.append('finCode', fin);
    formData.append('studentName', name);
    formData.append('schoolSelect', schoolText.trim());
    formData.append('applicationType', 'Əllə Daxiletmə');
    formData.append('academicYear', year);
    formData.append('coverLetter', emptyBlob, 'bos.txt');
    formData.append('residenceCertificate', emptyBlob, 'bos.txt');
    formData.append('xasiyyetname', emptyBlob, 'bos.txt');
    formData.append('idCopies', emptyBlob, 'bos.txt');
    formData.append('tabel', emptyBlob, 'bos.txt');
    formData.append('forma027', emptyBlob, 'bos.txt');

    try {
        const res = await fetch('http://127.0.0.1:8001/api/school/submit-student', {
            method: 'POST', body: formData
        });
        if (res.ok) {
            const result = await res.json();
            await fetch('http://127.0.0.1:8001/api/komissiya/update-decision', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id: result.id, decisionStatus: decisionStatus, educationForm: educationForm, notes: "", expiryDate: expiryDate})
            });
            document.getElementById('manual-name').value = "";
            document.getElementById('manual-fin').value = "";
            document.getElementById('manual-expiry').value = "";
            document.getElementById('manual-form').value = "-";
            await loadCommissionTable();
        } else { alert("⚠️ Server xətası."); }
    } catch(e) { alert("⚠️ Serverə qoşulmaq mümkün olmadı!"); }
}

function handleManualFile(input) {
    const file = input.files[0];
    if (!file) return;

    uploadedFileName = file.name;
    const reader = new FileReader();
    reader.onload = function(e) {
        const result = e.target.result;
        const sizeKB = Math.round((result.length * 2) / 1024);
        if (sizeKB > 3000) {
            alert("⚠️ Fayl həddən böyükdür (" + sizeKB + " KB). LocalStorage limiti 5MB-dır. Kiçik həcmli PDF istifadə edin, əks halda saxlanılmaya bilər.");
        }
        uploadedFileBase64 = result;
        const infoLabel = document.getElementById('file-info-label');
        infoLabel.innerText = "Yükləndi: " + file.name + " (" + sizeKB + " KB)";
        infoLabel.style.display = "block";
        document.getElementById('upload-status-text').style.display = "none";
    };
    reader.readAsDataURL(file);
}

function selectStudent(app, rowElement) {
    selectedAppId = app.id;
    document.querySelectorAll('.student-row').forEach(r => r.classList.remove('active'));
    rowElement.classList.add('active');

    document.getElementById('sidebar-default-msg').style.display = "none";
    document.getElementById('sidebar-actual-content').style.display = "block";

    document.getElementById('panel-name').innerText = app.name + " (" + app.fin + ")";
    document.getElementById('panel-school').innerText = app.schoolText;
    
    document.getElementById('text-notes').value = app.notes || "";
    document.getElementById('select-status').value = app.decisionStatus || "Gözləmədə";
    document.getElementById('select-form').value = app.educationForm !== "-" ? app.educationForm : "Evdə təhsil (Ümumi proqram)";
    document.getElementById('decision-expiry-date').value = app.expiryDate && app.expiryDate !== "-" ? app.expiryDate.split('.').reverse().join('-') : "";

    // Fayl yükləmə sahəsini sıfırla
    uploadedFileBase64 = app.manualFileData || null;
    uploadedFileName = app.manualFileName || null;
    document.getElementById('manual-file-upload').value = "";
    
    const infoLabel = document.getElementById('file-info-label');
    if(app.hasManualFile) {
        infoLabel.innerText = "Sistemdə fayl var: " + app.manualFileName;
        infoLabel.style.display = "block";
        document.getElementById('upload-status-text').style.display = "none";
    } else {
        infoLabel.style.display = "none";
        document.getElementById('upload-status-text').style.display = "block";
    }
}

async function saveCommissionDecision() {
    if (!selectedAppId) return;

    const notes = document.getElementById('text-notes').value;
    const finalDecision = document.getElementById('select-form').value;
    const status = document.getElementById('select-status').value;
    const expiry = document.getElementById('decision-expiry-date').value;
    const expiryDate = expiry ? expiry.split('-').reverse().join('.') : "-";

    const payload = {
        id: selectedAppId,
        decisionStatus: status,
        educationForm: finalDecision,
        notes: notes,
        expiryDate: expiryDate
    };

    // Yüklənmiş fayl varsa, onu da serverə göndər
    if (uploadedFileBase64) {
        payload.manualFileData = uploadedFileBase64;
        payload.manualFileName = uploadedFileName;
    }

    try {
        const res = await fetch('http://127.0.0.1:8001/api/komissiya/update-decision', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        if (res.ok) {
            alert("✅ Komissiya qərarı uğurla bazaya yazıldı!");
            await loadCommissionTable();
        } else {
            alert("⚠️ Server xətası. Qərar yazılmadı.");
        }
    } catch(e) {
        alert("⚠️ Serverə qoşulmaq mümkün olmadı! Python serveri işlədiyindən əmin olun.");
    }
}

async function downloadDecisionPDF(id) {
    let app = null;
    try {
        const res = await fetch('http://127.0.0.1:8001/api/komissiya/get-applications');
        const data = await res.json();
        app = data.find(item => item.id === id);
    } catch(e) {
        alert("⚠️ Serverə qoşulmaq mümkün olmadı!");
        return;
    }

    if(!app) { alert("⚠️ Məlumat tapılmadı!"); return; }

    // Əgər ekspert əllə xüsusi skan sənəd yükləyibsə, birbaşa həmin sənədi endirir
    if(app.hasManualFile && app.manualFileData) {
        const link = document.createElement("a");
        link.href = app.manualFileData;
        link.download = "Rəsmi_Qərar_" + app.manualFileName;
        link.click();
        return;
    }

    // Əgər əllə yüklənən sənəd yoxdursa, avtomatlaşdırılmış mətn generasiya edilir
    const pdfContent = `
==================================================
        PSİXOLOJİ-TİBBİ-PEDAQOJİ KOMİSSİYA
          GƏNCƏ-DAŞKƏSƏN REGİONAL TƏHSİL İDARƏSİ
==================================================
MÜƏSSİSƏ: ${app.schoolText}
TƏDRİS İLİ: ${app.year}
ŞAGİRD (S.A.A): ${app.name}
FİN KOD: ${app.fin}
--------------------------------------------------
QƏRARIN STATUSU: ${app.decisionStatus || 'Gözləmədə'}
TƏHSİL FORMASI QƏRARI: 
--> ${app.educationForm}

QÜVVƏDƏ OLMA MÜDDƏTİ: ${app.expiryDate || '-'}
--------------------------------------------------
KOMİSSİYA EKSPERT DİAQNOZU VƏ RƏYİ:
"${app.notes || 'Rəsmi rəy qeyd edilməmişdir.'}"
--------------------------------------------------
Tarix: ${new Date().toLocaleDateString('az-AZ')}
Sistem tərəfindən rəqəmsal olaraq təsdiqlənmişdir.
==================================================`;

    const blob = new Blob([pdfContent], { type: "text/plain;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `${app.fin}_PTPK_Rey_Hesabati.txt`;
    link.click();
}

async function deleteStudent(id) {
    if(confirm("Məlumatı silmək istəyirsiniz?")) {
        try {
            await fetch('http://127.0.0.1:8001/api/komissiya/delete-application?id=' + id, {method: 'DELETE'});
        } catch(e) {}
        if(selectedAppId === id) {
            selectedAppId = null;
            document.getElementById('sidebar-default-msg').style.display = "block";
            document.getElementById('sidebar-actual-content').style.display = "none";
        }
        await loadCommissionTable();
    }
}

async function exportAllExcel() {
    let data = [];
    try {
        const res = await fetch('http://127.0.0.1:8001/api/komissiya/get-applications');
        data = await res.json();
    } catch(e) {}
    if (data.length === 0) { alert("Cədvəldə məlumat yoxdur!"); return; }

    const headers = ['Şagirdin S.A.A. (FİN)', 'Tədris İli', 'Sənəd Statusu', 'Qərar Statusu', 'Müddət', 'Təhsil Forması', 'Məktəb'];
    let html = '<table border="1"><thead><tr>' +
        headers.map(h => `<th style="background:#0f172a;color:#fff;font-weight:bold;padding:6px 10px;">${h}</th>`).join('') +
        '</tr></thead><tbody>';

    // Group by school
    let grouped = {};
    data.forEach(app => {
        if (!grouped[app.schoolText]) grouped[app.schoolText] = [];
        grouped[app.schoolText].push(app);
    });

    for (let school in grouped) {
        html += `<tr><td colspan="7" style="background:#e2e8f0;font-weight:bold;padding:6px 10px;">${school}</td></tr>`;
        grouped[school].forEach(app => {
            html += '<tr>' + [
                `${app.name} (${app.fin})`,
                app.year || '-',
                app.docStatus || '-',
                app.decisionStatus || 'Gözləmədə',
                app.expiryDate || '-',
                app.educationForm || '-',
                app.schoolText || '-'
            ].map(c => `<td style="padding:5px 10px;">${c}</td>`).join('') + '</tr>';
        });
    }
    html += '</tbody></table>';

    const a = document.createElement('a');
    a.href = 'data:application/vnd.ms-excel,﻿' + encodeURIComponent(html);
    a.download = 'PTPK_Komissiya_Siyahisi.xls';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

function filterStudents() {
    const filter = document.getElementById('studentSearch').value.toUpperCase();
    const rows = document.querySelectorAll('.student-row');
    rows.forEach(row => {
        const text = row.cells[0].textContent || row.cells[0].innerText;
        row.style.display = text.toUpperCase().indexOf(filter) > -1 ? "" : "none";
    });
}
</script>
</body>
</html>
