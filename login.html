<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTPK - Sistemə Giriş</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; color: #1a1a1a; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #4a4a4a; font-weight: 600; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus { border-color: #007bff; outline: none; }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #0056b3; }
        .error-message { color: #dc3545; text-align: center; margin-top: 15px; font-size: 14px; min-height: 20px; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>PTPK Portal</h2>
    <div class="input-group">
        <label for="username">İstifadəçi Adı</label>
        <input type="text" id="username" placeholder="İstifadəçi adınızı yazın">
    </div>
    <div class="input-group">
        <label for="password">Şifrə</label>
        <input type="password" id="password" placeholder="Şifrənizi yazın">
    </div>
    <button onclick="checkAuth()">Giriş Et</button>
    <div id="error-box" class="error-message"></div>
</div>

<script>
    function checkAuth() {
        const userInp = document.getElementById('username').value.trim().toLowerCase();
        const passInp = document.getElementById('password').value.trim();
        const errorBox = document.getElementById('error-box');

        errorBox.innerText = ""; 

        if (userInp === "" || passInp === "") {
            errorBox.innerText = "Zəhmət olmasa bütün sahələri doldurun.";
            return;
        }

        // İCAZƏLİ ŞƏXSLƏR (Siz, admin və katiblər)
        const privilegedUsers = ['fuad', 'admin', 'katib', 'katib1', 'katib2'];
        
        // Sınanma üçün vahid şifrə (Buraya öz real şifrənizi yaza bilərsiniz)
        const globalPassword = "123"; 

        if (passInp === globalPassword) {
            
            if (privilegedUsers.includes(userInp)) {
                // Katiblər və Siz bura daxilsiniz
                localStorage.setItem('userRole', 'komissiya_user');
                localStorage.setItem('loggedUser', userInp);
                window.location.href = 'komissiya.html';
            } else {
                // Siyahıda olmayan hər kəs məktəb qəbul edilir
                localStorage.setItem('userRole', 'school_user');
                localStorage.setItem('loggedUser', userInp);
                window.location.href = 'index.html';
            }

        } else {
            errorBox.innerText = "İstifadəçi adı və ya şifrə yanlışdır!";
        }
    }
</script>

</body>
</html>
